function:
  name: EmailAlUsuarioFn
  runtime: python3.12
  handler: handler.lambda_handler
  description: |
    Envía un correo electrónico al usuario asociado a la sesión de orquestación.
    Valida los parámetros del correo (cuerpo, razonamiento, adjuntos) y reenvía
    el evento email_to_user al orquestador para que se ejecute el envío real.
    NO usa LLM — es un validador y enrutador de eventos.
  timeout: 120
  memory_size: 512
  layers:
    - foundationMinimal
    - foundationApi
  parameters:
    required:
      - name: body
        type: string
        description: "Contenido del correo en formato HTML (no Markdown)"
    optional:
      - name: reasoning
        type: string
        description: >-
          Por qué se envía este correo. Es una anotación para la traza de la
          sesión, no llega al cliente: lo que el cliente lee es `body`.
      - name: attachments
        type: array
        description: >-
          Lista de adjuntos. Cada elemento es {"uuid": "<uuid-del-archivo>",
          "source": "<tipo>"}. "source" debe ser exactamente uno de:
          email, whatsapp, file, upload, excel_analyst. NO es una URL ni una
          ruta. Un archivo que el usuario mandó por correo es "email"; por
          WhatsApp, "whatsapp". "upload" es sólo para archivos subidos a la
          plataforma. Si el envío falla, eso no significa que los archivos del
          usuario estén mal: nunca le pidas que reenvíe archivos que ya están
          en la sesión.
  widget:
    enabled: false
